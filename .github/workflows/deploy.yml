name: CI/CD - ThaiFlash

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Autorisations requises pour déployer nativement sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'éviter les collisions de déploiement
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Récupération du code source
      uses: actions/checkout@v4

    - name: 🟢 Configuration de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Installation des dépendances
      run: npm ci --legacy-peer-deps

    - name: 🔍 Vérification du Linter (TypeScript)
      run: npm run lint

    - name: 🏗️ Compilation de production (Vite Build)
      run: npm run build

    - name: 🛠️ Configuration de GitHub Pages
      uses: actions/configure-pages@v5

    - name: 📤 Téléchargement de l'artéfact de build
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

    - name: 🚀 Déploiement sur GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


